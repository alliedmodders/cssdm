name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: compute
        run: |
          base_version=$(sed "s/-dev//" product.version)
          build_number=$(git rev-list --count HEAD)
          echo "version=${base_version}-git${build_number}" >> "$GITHUB_OUTPUT"

  build:
    name: sm${{ matrix.sm.label }}
    needs: version
    runs-on: ${{ matrix.target.os }}
    container: ${{ matrix.target.container }}
    strategy:
      fail-fast: false
      matrix:
        sm:
          - label: "1.12"
          - label: "1.13"
        target:
          - os: ubuntu-latest
            os_name: linux
            container: ghcr.io/alliedmodders/build-containers/debian11-clang22:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch SourceMod Binary
        run: |
          mkdir sm_bin
          wget -O sm_bin.tar.gz "https://www.sourcemod.net/latest.php?os=linux&version=${{ matrix.sm.label }}"
          cd sm_bin
          tar xf ../sm_bin.tar.gz
          cd ..
          rm sm_bin.tar.gz

      - name: Set environment variables
        run: |
          echo "SOURCEMOD_BIN=$GITHUB_WORKSPACE/sm_bin" >> $GITHUB_ENV

      - name: Build (Linux)
        if: matrix.target.os_name == 'linux'
        env:
          CC: clang-22
          CXX: clang++-22
        run: |
          python3 ./configure.py \
            -o build
          cd build
          ambuild

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: pkg-sm${{ matrix.sm.label }}
          path: build/package
          if-no-files-found: error

  release:
    name: Release
    needs: [version, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble packages
        id: package
        run: |
          version="${{ needs.version.outputs.version }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          assets=""
          for label in 1.12 1.13; do
            dest="package-sm${label}/"
            mkdir -p "${dest}"
            for dir in artifacts/pkg-sm${label}/; do
              cp -a "${dir}." "${dest}/"
              [ -d "${dest}/cfg/cssdm/maps" ] || mkdir -p "${dest}/cfg/cssdm/maps"
            done
            asset="cssdm-${version}-sm${label}.zip"
            (cd "package-sm${label}" && zip -r "../${asset}" *)
            fi
            assets="${assets} ${asset}"
          done
          echo "assets=${assets# }" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.package.outputs.version }}" \
            ${{ steps.package.outputs.assets }} \
            --target "${GITHUB_SHA}" \
            --title "CSSDM ${{ steps.package.outputs.version }}" \
            --notes "Automated release built from ${GITHUB_SHA}."
